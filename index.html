function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2200)}
let actx=null;
function beep(f=880,d=0.25){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.3,actx.currentTime);o.start();o.stop(actx.currentTime+d);}catch(e){}}
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

const azar = a => a[Math.floor(Math.random()*a.length)];
const mezclar = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

let usuario = ls("rutina_usuario");
let nivel = 1, SESIONES = [], HOY = null;
const uid = () => usuario.trim().toLowerCase().replace(/\s+/g,"-");
const refUser = () => db.collection("usuarios").doc(uid());

async function guardar(ses){
  if(db){ await refUser().collection("sesiones").add(ses); }
  else { const k="rutina_local_"+uid(); const a=JSON.parse(ls(k)||"[]"); a.push(ses); ls(k,JSON.stringify(a)); }
}
async function cargar(){
  if(db){ const s=await refUser().collection("sesiones").orderBy("fecha","desc").limit(60).get(); return s.docs.map(d=>d.data()); }
  return JSON.parse(ls("rutina_local_"+uid())||"[]").sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

  try{ if(db){ const d=await refUser().get(); nivel=(d.exists&&d.data().nivel)||1; } else nivel=+(ls("rutina_nivel_"+uid())||1); }catch(e){ nivel=1; }
}
async function guardarNivel(n){
  nivel=n; if(db) await refUser().set({nivel:n},{merge:true}); else ls("rutina_nivel_"+uid(),String(n));
}

// ---------- Generador de rutinas ----------
function elegir(patron, usados, evitar){
  const todos=Object.entries(EJ).filter(([,e])=>e.p===patron);
  const deNivel=todos.filter(([,e])=>e.lv<=nivel && e.lv>=nivel-1);
  const base=deNivel.length?deNivel:todos.filter(([,e])=>e.lv<=nivel);
  let c=base.filter(([id])=>!usados.has(id)&&!evitar.has(id));
  if(!c.length) c=base.filter(([id])=>!usados.has(id));
  if(!c.length) c=todos.filter(([id])=>!usados.has(id));
  return c.length?azar(c)[0]:null;
}
function generar(evitarExtra){
  const ultima = SESIONES.find(s=>s.rutina && s.tipoDia);
  const iDia = ultima ? (DIAS.findIndex(d=>d.id===ultima.tipoDia)+1)%3 : 0;
  const dia = DIAS[iDia];
  const evitar = new Set([...(ultima?.ejercicios||[]), ...(evitarExtra||[])]);
  const usados = new Set();
  const patrones = ["empuje","tiron","piernas","cadera","abdomen"];
  const principal=[];
  for(const p of patrones){ const id=elegir(p,usados,evitar); if(id){usados.add(id);principal.push(id);} }
  const ex=elegir(dia.extra,usados,evitar); if(ex){usados.add(ex);principal.splice(patrones.indexOf(dia.extra)+1,0,ex);}
  const fmts = Object.keys(FORMATOS).filter(f=>f!==ultima?.formato && f!==HOY?.formato);
  const formato = azar(fmts);
  const cal = ["marcha", ...mezclar(["brazos","cadera","gato"]).slice(0,2)];
  const fin = mezclar(["estPecho","estIsquios","estBrazo","estGato"]).slice(0,2);
  const r = {tipoDia:dia.id, formato, principal, cal, fin};
  r.pasos = armarPasos(r);
  r.minutos = Math.round(r.pasos.reduce((a,p)=>a+(p.t==="desc"?p.seg:(p.tipo==="tiempo"?p.seg:45)),0)/60);
  return r;
}
function dosis(id, modo){
  const e=EJ[id];
  if(modo==="tiempo"){ const seg = e.s ? Math.min(40,e.s+10) : 40;
    return {tipo:"tiempo",seg,txt:`${seg} segundos${e.lado?" (cambiá de lado a la mitad)":""}`}; }
  if(e.s) return {tipo:"tiempo",seg:e.s*(e.lado?2:1),txt:`${e.s} segundos${e.lado?" por lado":""}`};
  return {tipo:"reps",txt:`${e.r} repeticiones${e.lado?" por lado":""}`};
}
function armarPasos(r){
  const p=[]; const ej=(id,etq,modo)=>p.push({t:"ej",id,etq,...dosis(id,modo)}); const desc=seg=>p.push({t:"desc",seg});
  r.cal.forEach(id=>p.push({t:"ej",id,etq:"Calentamiento",tipo:"tiempo",seg:EJ[id].s,txt:`${EJ[id].s} segundos`}));
  desc(20);
  const L=r.principal;
  if(r.formato==="circuito"||r.formato==="tiempo"){
    for(let v=1;v<=2;v++){ L.forEach((id,i)=>{ ej(id,`Vuelta ${v} de 2`, r.formato==="tiempo"?"tiempo":"normal"); if(i<L.length-1) desc(20); }); if(v<2) desc(60); }
  } else if(r.formato==="series"){
    L.forEach((id,i)=>{ for(let s=1;s<=2;s++){ ej(id,`Serie ${s} de 2`,"normal"); if(!(i===L.length-1&&s===2)) desc(s===1?40:30); } });
  } else {
    for(let i=0;i<L.length;i+=2){ const par=L.slice(i,i+2);
      for(let v=1;v<=2;v++){ par.forEach((id,j)=>{ ej(id,`Par ${i/2+1} · vuelta ${v} de 2`,"normal"); if(j<par.length-1) desc(15); });
        if(!(i+2>=L.length&&v===2)) desc(45); } }
  }
  desc(20);
  r.fin.forEach(id=>p.push({t:"ej",id,etq:"Para cerrar",tipo:"tiempo",seg:EJ[id].s,txt:`${EJ[id].s} segundos${EJ[id].lado?" (cambiá a la mitad)":""}`}));
  return p;
}

// ---------- Entrenamiento ----------
let E=null;
async function lockOn(){try{E.lock=await navigator.wakeLock?.request("screen")}catch(e){}}
function lockOff(){try{E?.lock?.release()}catch(e){}}

function vEntreno(){
  E={rutina:HOY,pasos:HOY.pasos,i:0,rest:0,timer:null,pausa:false,lock:null};
  beep(660,0.05); lockOn(); paso();
}
function stopTimer(){ if(E?.timer){clearInterval(E.timer);E.timer=null;} }
function siguiente(){ stopTimer(); E.i++; if(E.i>=E.pasos.length){ beep(988,0.5); lockOff(); vFin(); } else paso(); }
function arrancar(seg, avisoMitad){
  E.rest=seg; E.pausa=false; pintarReloj(); const mitad=Math.floor(seg/2);
  E.timer=setInterval(()=>{ if(E.pausa) return; E.rest--;
    if(avisoMitad && E.rest===mitad){ beep(523,0.15); }
    if(E.rest<=3&&E.rest>0) beep(660,0.08); pintarReloj();
    if(E.rest<=0){ beep(988,0.4); siguiente(); } },1000);
}
function pintarReloj(){ const r=$("#reloj"); if(r) r.textContent=fmt(Math.max(0,E.rest)); const p=$("#pau"); if(p) p.textContent=E.pausa?"Seguir":"Pausa"; }
function proxEj(){ for(let j=E.i+1;j<E.pasos.length;j++) if(E.pasos[j].t==="ej") return E.pasos[j]; return null; }

function paso(){
  const st=E.pasos[E.i], total=E.pasos.length, pct=Math.round(E.i/total*100);
  const cab = `
    <div class="flex justify-between items-center mb-2">
      <button id="fin" class="text-slate-400 text-sm">✕ Terminar</button>
      <span class="text-sm text-slate-400">Paso ${E.i+1} de ${total}</span>
    </div>
    <div class="h-2 bg-slate-800 rounded-full mb-4"><div class="h-2 bg-amber-500 rounded-full" style="width:${pct}%"></div></div>`;
  if(st.t==="desc"){
    const n=proxEj(), e=EJ[n.id];
    app().innerHTML = cab+`
      <div class="text-center">
        <div class="text-slate-400 uppercase tracking-wide text-sm">Descanso</div>
        <div id="reloj" class="text-7xl font-bold my-4"></div>
        <div class="card text-left mt-4">
          <div class="text-sm text-slate-400">Sigue · ${n.etq}</div>
          <div class="font-semibold">${e.n} <span class="text-amber-400 text-sm">· ${n.txt}</span></div>
          <div class="h-24 mt-2">${e.img}</div>
        </div>
        <div class="grid grid-cols-2 gap-3 mt-4">
          <button id="pau" class="btn b2">Pausa</button>
          <button id="sal" class="btn b1">Saltar</button>
        </div>
      </div>`;
    $("#pau").onclick=()=>{E.pausa=!E.pausa;pintarReloj();};
    $("#sal").onclick=siguiente;
    arrancar(st.seg,false);
  } else {
    const e=EJ[st.id];
    app().innerHTML = cab+`
      <div class="text-sm text-amber-400 mb-1">${st.etq}</div>
      <h2 class="text-2xl font-bold mb-2">${e.n}</h2>
      <div class="card mb-3"><div class="h-40">${e.img}</div></div>
      <div class="text-xl font-semibold text-amber-400 mb-2">${st.txt}</div>
      <p class="text-slate-300 text-sm mb-4">${e.d}</p>
      ${st.tipo==="tiempo"
        ? `<div id="reloj" class="text-6xl font-bold text-center mb-4"></div>
           <div class="grid grid-cols-2 gap-3"><button id="pau" class="btn b2">Pausa</button><button id="sal" class="btn b1">Listo</button></div>`
        : `<button id="sal" class="btn b1">Listo, siguiente</button>`}`;
    $("#sal").onclick=siguiente;
    if(st.tipo==="tiempo"){ $("#pau").onclick=()=>{E.pausa=!E.pausa;pintarReloj();}; arrancar(st.seg, !!e.lado); }
  }
  $("#fin").onclick=()=>{ if(confirm("Terminar la rutina ahora")){ stopTimer(); lockOff(); vRegistro(E.i>6?E.rutina:null); } };
}

function vFin(){
  app().innerHTML = `
  <div class="text-center pt-16">
    <div class="text-6xl mb-4">🔥</div>
    <h1 class="text-3xl font-bold mb-2">Rutina terminada</h1>
    <p class="text-slate-400 mb-8">Anotá cómo te fue.</p>
    <button id="r" class="btn b1">Registrar sesión</button>
  </div>`;

}

// ---------- Registro ----------
function rodilla(id,nom){
  return `<div class="card mb-3">
    <div class="font-semibold mb-2">${nom}</div>
    <div class="flex justify-between text-sm text-slate-400"><span>Dolor</span><span><b id="${id}v" class="text-amber-400 text-base">0</b> / 10</span></div>
    <input type="range" id="${id}d" min="0" max="10" value="0">
    <label class="flex items-center gap-2 mt-2 text-sm"><input type="checkbox" id="${id}h" style="width:auto"> Se hinchó</label>
  </div>`;
}
function vRegistro(rutina){
  app().innerHTML = `
  <button id="vol" class="text-slate-400 mb-3">← Volver</button>
  <h1 class="text-2xl font-bold mb-4">Registro de hoy</h1>
  <div class="card mb-3">
    <label class="flex items-center gap-2 mb-3"><input type="checkbox" id="rut" style="width:auto" ${rutina?"checked":""}> Hice la rutina de casa</label>
    <label class="block text-sm text-slate-400 mb-1">Minutos de bici</label>
    <input type="number" id="bici" min="0" inputmode="numeric" placeholder="0">
  </div>
  <div class="card mb-3">
    <div class="font-semibold mb-2">Cómo estuvo la rutina</div>
    <select id="esf"><option value="">Sin dato</option><option value="facil">Fácil</option><option value="justa">Justa</option><option value="dura">Dura</option></select>
  </div>
  ${rodilla("izq","Rodilla izquierda (operada)")}
  ${rodilla("der","Rodilla derecha")}
  <div class="card mb-4">
    <label class="block text-sm text-slate-400 mb-1">Nota (opcional)</label>
    <textarea id="nota" rows="2" placeholder="Cómo te sentiste, algo que molestó..."></textarea>
  </div>
  <button id="ok" class="btn b1">Guardar</button>`;
  ["izq","der"].forEach(k=>{$("#"+k+"d").oninput=e=>$("#"+k+"v").textContent=e.target.value;});
  $("#vol").onclick=vHome;
  $("#ok").onclick=async()=>{
    const b=$("#ok"); b.disabled=true; b.textContent="Guardando…";
    const hizo=$("#rut").checked;
    const ses={fecha:new Date().toISOString(),rutina:hizo,bici:+$("#bici").value||0,esfuerzo:$("#esf").value,
      izqDolor:+$("#izqd").value,izqHinch:$("#izqh").checked,derDolor:+$("#derd").value,derHinch:$("#derh").checked,
      nota:$("#nota").value.trim()};
    if(hizo && rutina){ Object.assign(ses,{tipoDia:rutina.tipoDia,formato:rutina.formato,ejercicios:rutina.principal,nivel}); }
    try{ await guardar(ses); toast("Sesión guardada"); vHome(); }
    catch(e){ console.error(e); b.disabled=false; b.textContent="Guardar"; alert("No se pudo guardar. Revisá la conexión."); }
  };
}

    const s=await cargar();
    const rod=(n,d,h)=>{const mal=d>3||h; return `<span class="${mal?"text-red-400":"text-slate-300"}">${n}: ${d}/10${h?" · hinchada":""}</span>`;};
    const esfTxt={facil:"Fácil",justa:"Justa",dura:"Dura"};
    $("#lst").innerHTML = s.length ? s.map(x=>{
      const dia=DIAS.find(d=>d.id===x.tipoDia);
      return `<div class="card mb-3">
        <div class="flex justify-between items-center mb-1">
          <span class="font-semibold capitalize">${fechaTxt(x.fecha)}</span>
          <span class="text-sm">${x.rutina?'<span class="text-emerald-400">✓ Rutina</span>':""}${x.bici?` <span class="text-amber-400 ml-2">🚲 ${x.bici} min</span>`:""}</span>
        </div>
        ${dia?`<div class="text-sm text-slate-400 mb-1">${dia.nombre} · ${FORMATOS[x.formato]?.n||""}${x.esfuerzo?` · ${esfTxt[x.esfuerzo]}`:""}</div>`:""}
        ${x.ejercicios?`<div class="text-xs text-slate-500 mb-1">${x.ejercicios.map(id=>EJ[id]?.n||id).join(" · ")}</div>`:""}
        <div class="text-sm flex flex-col">${rod("Izquierda",x.izqDolor,x.izqHinch)}${rod("Derecha",x.derDolor,x.derHinch)}</div>
        ${x.nota?`<div class="text-sm text-slate-400 mt-1">${esc(x.nota)}</div>`:""}
      </div>`;}).join("") : "Todavía no hay sesiones.";
  }catch(e){ console.error(e); $("#lst").textContent="No se pudieron cargar los datos. Revisá la conexión."; }
}

usuario ? vHome() : vLogin();
